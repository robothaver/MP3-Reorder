[versions]
junit = "6.1.1"
mp3agic = "0.9.1"
log4j = "2.26.1"
atlantafx = "2.1.0"
ikonli = "12.4.0"

javamodularity = "2.0.0"
javafx-plugin = "0.1.0"
jlink = "3.1.5"
lombok = "9.5.0"

[libraries]
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

mp3agic = { module = "com.mpatric:mp3agic", version.ref = "mp3agic" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }

ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-feather-pack = { module = "org.kordamp.ikonli:ikonli-feather-pack", version.ref = "ikonli" }

[plugins]
javamodularity = { id = "org.javamodularity.moduleplugin", version.ref = "javamodularity" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
jlink = { id = "org.beryx.jlink", version.ref = "jlink" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }